<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HBntory — Product &amp; Stock Assistant</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <header class="header">
      <h1>HBntory</h1>
      <p class="subtitle">Ask about product details, availability, or branch stock.</p>
    </header>

    <form id="query-form" class="query-form">
      <input
        id="question-input"
        type="text"
        placeholder="e.g. Which branch has stock of product HB-LAP-1001?"
        autocomplete="off"
        required
      />
      <button type="submit" id="submit-btn">Ask</button>
    </form>

    <section id="result" class="result" aria-live="polite">
      <p class="result-placeholder">Your answer will appear here.</p>
    </section>

    <section class="examples">
      <p class="examples-title">Example questions</p>
      <ul>
        <li><button type="button" class="example-btn">Give me details about product HB-LAP-1001.</button></li>
        <li><button type="button" class="example-btn">Which branch has stock of product HB-LAP-1001?</button></li>
        <li><button type="button" class="example-btn">What products can I find in branch BR-1?</button></li>
        <li><button type="button" class="example-btn">If I want to buy 3 units of HB-KEY-2003, which branch should I visit?</button></li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
