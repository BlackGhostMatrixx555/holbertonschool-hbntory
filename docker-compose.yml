services:
  db:
    image: postgres:16-alpine
    container_name: hbntory_db
    environment:
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory_password
      POSTGRES_DB: inventory
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory_user -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hbntory_backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "HBntory Backend"
      ENVIRONMENT: "development"
      DATABASE_URL: "postgresql+psycopg://inventory_user:inventory_password@db:5432/inventory"
      JWT_SECRET_KEY: "change-me-in-production"
      JWT_ALGORITHM: "HS256"
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      INTERNAL_API_KEY: "change-internal-key"
      CORS_ORIGINS: "http://localhost:8080,http://localhost:5173,http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy

  # NOTE: the Backoffice (Task 3) currently ships with its OWN separate
  # SQLite database and its own User/Branch/Stock models -- it does not
  # yet talk to the shared `backend` service above. It is wired into this
  # docker-compose so the whole system can be started with one command,
  # but see docs/COMPATIBILITY_REPORT.md for why this is a duplicate data
  # source that the team needs to resolve before final delivery.
  # Port changed from 8000 -> 8003 here to avoid colliding with `backend`.
  backoffice:
    build:
      context: ./backoffice
      dockerfile: Dockerfile
    container_name: hbntory_backoffice
    ports:
      - "8003:8000"
    environment:
      PYTHONUNBUFFERED: 1

  product-api:
    build:
      context: ./product_api
      dockerfile: Dockerfile
    container_name: hbntory_product_api
    ports:
      - "8001:8001"
    # NOTE: this is a placeholder stub, not the real provided Product API.
    # Swap this service for the actual hbtn-edu/hbntory-products-api Docker
    # image before final submission -- see COMPATIBILITY_REPORT.md.

  product_mcp_server:
    build:
      context: ./product_mcp_server
      dockerfile: Dockerfile
    container_name: hbntory_mcp_server
    environment:
      PRODUCT_API_URL: "http://product-api:8001"
      BACKEND_INTERNAL_URL: "http://backend:8000/internal"
      INTERNAL_API_KEY: "change-internal-key"
    depends_on:
      - backend
      - product-api

  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: hbntory_ai_service
    ports:
      - "8002:8002"
    environment:
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_MODEL: "${GROQ_MODEL:-llama-3.3-70b-versatile}"
      PRODUCT_API_URL: "http://product-api:8001"
      BACKEND_INTERNAL_URL: "http://backend:8000/internal"
      INTERNAL_API_KEY: "change-internal-key"
    depends_on:
      - backend
      - product-api

  client_web:
    image: nginx:alpine
    container_name: hbntory_client_web
    ports:
      - "8080:80"
    volumes:
      - ./client_web:/usr/share/nginx/html:ro
    depends_on:
      - ai_service

volumes:
  postgres_data:
